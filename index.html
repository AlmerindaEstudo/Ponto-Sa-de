<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SaúdeMap</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
</head>
<body>

  <header class="top-bar">
    <div class="logo">
      <span class="icon-box">
    <i class="bi bi-geo-alt-fill"></i>
  </span>
      <div>
        <h1>Ponto Saúde</h1>
        <small>Encontre serviços de saúde</small>
      </div>
    </div>

    <div class="colab-actions">
      <button id="btn-login-colaborador" class="user-btn">Usuário Colaborador</button>
      <button id="btn-logout-colaborador" class="user-btn logout-btn" style="display: none;"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </header>

  <section class="stats">
    <div class="card">
      <div class="icon-box red">
        <i class="bi bi-hospital"></i>
      </div>
      <h2 id="count-hospital">0</h2>
      <p>Hospitais</p>
    </div>

    <div class="card">
      <div class="icon-box blue">
      <i class="bi bi-buildings"></i>
      </div>
      <h2 id="count-posto">0</h2>
      <p>Postos</p>
    </div>

    <div class="card">
      <div class="icon-box orange">
      <i class="bi bi-building"></i>
      </div>
      <h2 id="count-upa">0</h2>
      <p>UPAs</p>
    </div>
    <div class="card">
     <div class="icon-box green">
   <i class="bi bi-shop-window"></i>
    </div>
    <h2 id="count-farmacia"></h2>
    <p>Farmácia</p>
  </div>
  </section>

  <section class="filters">
    <button class="active" data-filter="todos"><i class="bi bi-geo-alt"></i> Todos</button>
    <button data-filter="hospital"><i class="bi bi-hospital"></i> Hospitais</button>
    <button data-filter="posto"><i class="bi bi-buildings"></i> Postos</button>
    <button data-filter="upa"><i class="bi bi-building"></i> UPAs</button>
    <button data-filter="farmacia"><i class="bi-shop-window"></i> Farmácia</button>
    
    <button id="btn-location"><i class="bi bi-send"></i> Localização Atual</button>
  </section>

  <div class="button-locais">
    <button id="btn-toggle-list" class="user-btn"><i class="bi bi-list-ul"></i> Ver Locais Próximos</button>
  </div>

  <div id="overlay" class="overlay"></div>

  <aside id="sidebar-locais" class="sidebar">
    <div class="sidebar-header">
      <h3 id="sidebar-titulo">Locais Próximos</h3>
      <button id="btn-close-list"><i class="bi bi-x-lg"></i></button>
    </div>
    
    <!-- Modo: Lista de Locais Próximos -->
    <div id="modo-lista" class="modo-sidebar">
      <ul id="lista-locais">
        <li style="padding: 20px; color: #777; text-align: center;">Use sua localização para ver os locais próximos.</li>
      </ul>
    </div>

    <!-- Modo: Detalhes do Local Selecionado -->
    <div id="modo-detalhes" class="modo-sidebar" style="display: none;">
      <div id="detalhes-local" class="detalhes-container">
        <!-- Será preenchido dinamicamente pelo JS -->
      </div>
    </div>
  </aside>

  <div id="map"></div>

  <!-- USUÁRIO COLABORADOR - MODAL DE LOGIN -->

  <div id="login-overlay" class="login-overlay">
  <div class="login-modal">
    <button id="btn-close-login" class="btn-close-login"><i class="bi bi-x-lg"></i></button>
    
    <div class="login-header">
      <div class="icon-box blue" style="margin: 0 auto 15px;">
        <i class="bi bi-person-badge-fill"></i>
      </div>
      <h2>Portal do Colaborador</h2>
      <p>Acesse para gerenciar os locais de saúde.</p>
    </div>

    <form id="form-login">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="exemplo@saudemap.com">
        <span class="error-msg" id="erro-email"></span>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••">
        <span class="error-msg" id="erro-senha"></span>
      </div>

      <div id="mensagem-servidor" class="mensagem-servidor"></div>

      <button type="submit" class="btn-submit">Entrar</button>
    </form>
  </div>
</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 <script src="js/icones.js"></script>
<script src="js/mapa.js"></script>
<script src="js/dados-locais.js"></script>
<script src="js/detalhes-local.js"></script>
<script src="js/geolocalizacao.js"></script>
<script src="js/proximidade.js"></script>
<script src="js/lateral_distancia.js"></script>
<script src="js/autenticacao.js"></script>
<script src="js/contadores.js"></script>
</body>
</html>
